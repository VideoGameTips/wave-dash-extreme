<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave Dash Extreme</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #66f7ff;
      --pink: #ff4ecf;
      --red: #ff245c;
      --ink: #070913;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #03040a;
      color: white;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #080a14;
    }
    .hud {
      position: fixed;
      inset: 18px 18px auto 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(0,0,0,.85);
    }
    .score {
      font-weight: 900;
      letter-spacing: .08em;
      font-size: clamp(18px, 3vw, 34px);
    }
    .mode {
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(6,8,18,.56);
      font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--cyan);
      text-align: right;
    }
    .menu {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at 30% 40%, rgba(255,78,207,.20), transparent 34%),
        radial-gradient(circle at 70% 60%, rgba(102,247,255,.15), transparent 36%),
        rgba(2,3,9,.82);
    }
    .panel {
      width: min(560px, 94vw);
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(5,7,16,.86);
      box-shadow: 0 28px 80px rgba(0,0,0,.58);
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 8vw, 72px);
      line-height: .88;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    p {
      margin: 0 0 18px;
      color: rgba(255,255,255,.72);
      line-height: 1.45;
    }
    .trails {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 16px 0 18px;
    }
    button {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: white;
      padding: 11px 10px;
      font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }
    button:hover, button.active { border-color: var(--cyan); background: rgba(102,247,255,.16); }
    .start {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, rgba(102,247,255,.25), rgba(255,78,207,.25));
      font-size: 15px;
    }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255,255,255,.56);
    }
    @media (max-width: 560px) {
      .trails { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hud { inset: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div>
      <div class="score" id="score">0</div>
      <div id="best">BEST 0</div>
    </div>
    <div class="mode" id="mode">NORMAL</div>
  </div>
  <div class="menu" id="menu">
    <div class="panel">
      <h1>Wave Dash Extreme</h1>
      <p>Hold mouse, touch, or Space to climb. Release to dive. Survive the spikes, lasers, traps, blackouts, and giant right-side bosses.</p>
      <div class="trails" id="trails"></div>
      <button class="start" id="start">START RUN</button>
      <div class="hint">Press / three times in one second to force Extreme Demon.</div>
    </div>
  </div>
  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const modeEl = document.getElementById('mode');
    const menu = document.getElementById('menu');
    const startBtn = document.getElementById('start');
    const trailsEl = document.getElementById('trails');

    const trailThemes = {
      comet: { name: 'Comet', hues: [185, 196, 210] },
      inferno: { name: 'Inferno', hues: [14, 34, 52] },
      toxic: { name: 'Toxic', hues: [94, 126, 152] },
      royal: { name: 'Royal', hues: [264, 286, 312] },
      void: { name: 'Void', hues: [326, 352, 18] },
    };

    const realms = [
      { at: 0, name: 'Neon Drift', tag: 'NORMAL', hue: 185, accent: '#66f7ff', bg: ['#080a14', '#111a30', '#090b12'], dark: 0, lightsOut: 0, flashOff: false, redLights: 0, fire: 0, speed: 1, gap: 0, pool: ['top','bottom','dual','diamond','spinner','sweep','sword','mines','shuriken','drop_shuriken','blackout','sniper'] },
      { at: 450, name: 'Chrome Thunder', tag: 'HARD', hue: 210, accent: '#9cc7ff', bg: ['#070b16', '#121b2e', '#060812'], dark: .05, lightsOut: 0, flashOff: false, redLights: .08, fire: 0, speed: 1.03, gap: 6, pool: ['dual','diamond','spinner','sweep','sword','mines','sniper','top','bottom','claw','saw','shuriken','drop_shuriken','slash_gate'] },
      { at: 900, name: 'Crimson Voltage', tag: 'INSANE', hue: 342, accent: '#ff3f7c', bg: ['#13050a', '#220912', '#070306'], dark: .10, lightsOut: .10, flashOff: false, redLights: .30, fire: .25, speed: 1.06, gap: 12, pool: ['sword','slash_gate','sniper','dual','diamond','spinner','sweep','mines','claw','saw','shuriken','drop_shuriken','blackout'] },
      { at: 1400, name: 'Void Cathedral', tag: 'DEMON', hue: 275, accent: '#c970ff', bg: ['#06040f', '#130926', '#030208'], dark: .46, lightsOut: .55, flashOff: true, redLights: .10, fire: 0, speed: 1.09, gap: 18, pool: ['blackout','sniper','sweep','spinner','slash_gate','sword','claw','saw','mines','diamond','boss','shuriken','drop_shuriken'] },
      { at: 2000, name: 'Infernal Demon Storm', tag: 'INFERNAL DEMON', hue: 14, accent: '#ff3a1f', bg: ['#120302', '#260704', '#050101'], dark: .34, lightsOut: .22, flashOff: false, redLights: .58, fire: 1, speed: 1.12, gap: 24, pool: ['sword','slash_gate','sniper','boss','dual','diamond','saw','claw','mines','blackout','sweep','shuriken','drop_shuriken'] },
      { at: 2850, name: 'Abyssal Laser Riot', tag: 'NIGHTMARE', hue: 326, accent: '#ff4ecf', bg: ['#05020b', '#150421', '#030106'], dark: .40, lightsOut: .35, flashOff: true, redLights: .36, fire: .35, speed: 1.15, gap: 30, pool: ['slash_gate','sweep','sword','sniper','boss','saw','claw','mines','blackout','spinner','shuriken','drop_shuriken'] },
      { at: 3800, name: 'Obsidian Godstorm', tag: 'EXTREME DEMON', hue: 0, accent: '#ff003c', bg: ['#020102', '#120005', '#000000'], dark: .50, lightsOut: .42, flashOff: true, redLights: .78, fire: .85, speed: 1.18, gap: 34, pool: ['boss','sword','slash_gate','sniper','saw','claw','blackout','mines','sweep','spinner','shuriken','drop_shuriken'] },
      { at: 5200, name: 'Glitched Eclipse', tag: 'MYTHIC DEMON', hue: 300, accent: '#ffffff', bg: ['#010105', '#0a0012', '#000000'], dark: .66, lightsOut: .75, flashOff: true, redLights: .46, fire: .55, speed: 1.20, gap: 38, pool: ['boss','blackout','sniper','slash_gate','sword','saw','claw','mines','sweep','spinner','shuriken','drop_shuriken'] },
    ];

    const state = {
      w: 0, h: 0, px: 112, y: 240, vy: 0, holding: false, active: false,
      dist: 0, nextX: 0, gapY: 240, spawnIndex: 0, best: Number(localStorage.wave_dash_extreme_best || 0),
      trail: [], obstacles: [], flashUntil: 0, darknessUntil: 0, bossNextAt: 4200,
      extreme: false, slashTimes: [], trailTheme: localStorage.wave_dash_trail || 'comet',
      last: 0, crashed: false, realmName: '',
    };

    function resize() {
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      state.w = Math.floor(innerWidth);
      state.h = Math.floor(innerHeight);
      canvas.width = Math.floor(state.w * dpr);
      canvas.height = Math.floor(state.h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      state.px = Math.max(82, Math.min(128, state.w * 0.16));
    }

    function difficulty() {
      const score = state.dist / 10;
      const demon = state.extreme ? 1 : Math.max(0, Math.min(1, (score - 1800) / 2400));
      const realm = currentRealm();
      return {
        demon,
        realm,
        speed: (360 + Math.min(210, state.dist * 0.006)) * (state.extreme ? 1.22 : 1) * realm.speed,
        gap: Math.max(94, 205 - Math.min(86, state.dist * 0.0065) - demon * 22 - realm.gap),
        spacing: Math.max(150, 330 - Math.min(96, state.dist * 0.0048) - demon * 28 - realm.gap * .45),
        width: 88 + demon * 16,
        size: 116 + demon * 20,
      };
    }

    function currentRealm() {
      if (state.extreme) return realms[realms.length - 1];
      const score = state.dist / 10;
      let realm = realms[0];
      for (const r of realms) if (score >= r.at) realm = r;
      return realm;
    }

    function reset() {
      resize();
      Object.assign(state, {
        y: state.h * 0.52, vy: 0, active: true, crashed: false, dist: 0, nextX: state.w + 120,
        gapY: state.h * 0.52, spawnIndex: 0, trail: [], obstacles: [], flashUntil: 0,
        darknessUntil: 0, bossNextAt: 4200, last: performance.now(),
      });
      for (let i = 0; i < 7; i++) spawnObstacle();
      menu.style.display = 'none';
      requestAnimationFrame(frame);
    }

    function spawnObstacle() {
      const d = difficulty();
      const travel = d.spacing / Math.max(1, d.speed);
      const maxRise = travel * 410 * .95;
      const margin = d.gap * .55 + 32;
      state.spawnIndex++;
      const slam = state.spawnIndex % 3 === 0;
      const sign = state.gapY < state.h * .5 ? 1 : -1;
      const drift = slam ? sign * (0.62 + Math.random() * .34) * maxRise : (Math.random() * 2 - 1) * maxRise * .86;
      state.gapY = clamp(state.gapY + drift, margin, state.h - margin);
      const roll = Math.random();
      const bossDue = state.dist >= state.bossNextAt && state.spawnIndex % (state.extreme ? 3 : 5) === 0;
      if (bossDue) state.bossNextAt = state.dist + (state.extreme ? 2400 : 6200) + Math.random() * (state.extreme ? 1500 : 3400);
      const realm = d.realm;
      const type = bossDue ? 'boss' : pick(roll, realm.pool);
      state.obstacles.push({
        x: state.nextX, w: d.width, gapY: state.gapY, gapH: d.gap, size: d.size, type,
        spin: Math.random() * Math.PI, phase: Math.random() * Math.PI * 2, hue: realm.hue + Math.sin(state.dist * .003) * 32,
        realmFire: realm.fire,
        fired: false, armedAt: 0, targetY: 0, shot: null, shots: [], laser: null, bossTimer: 0,
        bossPattern: Math.floor(Math.random() * 3), bossBeam: null,
      });
      state.nextX += d.spacing + Math.random() * 44;
    }

    function pick(r, list) {
      const i = Math.min(list.length - 1, Math.floor(r * list.length));
      return list[i];
    }

    function frame(now) {
      if (!state.active) return;
      const dt = Math.min(.033, Math.max(.001, (now - state.last) / 1000 || .016));
      state.last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    function update(dt) {
      const d = difficulty();
      state.vy = state.holding ? -410 : 410;
      state.y += state.vy * dt;
      state.dist += d.speed * dt;
      state.nextX -= d.speed * dt;
      addTrail(dt);
      for (const o of state.obstacles) {
        if (o.type === 'boss' && o.fired) o.x = Math.max(o.x - d.speed * dt * .18, state.w - Math.max(160, o.size * 1.24));
        else o.x -= d.speed * dt;
      }
      hazards(dt);
      while (state.obstacles.length && done(state.obstacles[0])) state.obstacles.shift();
      while (state.nextX < state.w + 260) spawnObstacle();
      if (state.y < 18 || state.y > state.h - 18) crash();
      for (const o of state.obstacles) if (hit(o, state.px, state.y, 7)) crash();
      scoreEl.textContent = Math.floor(state.dist / 10);
      const realm = d.realm;
      modeEl.textContent = `${realm.tag}\n${realm.name}`;
      modeEl.style.whiteSpace = 'pre-line';
      modeEl.style.color = realm.accent;
      if (realm.name !== state.realmName) {
        state.realmName = realm.name;
        flash(180);
      }
    }

    function hazards(dt) {
      for (const o of state.obstacles) {
        if ((o.type === 'shooter' || o.type === 'burst') && !o.fired && o.x < state.w * .92 && o.x > state.px + 28) {
          fireAtWave(o, o.type === 'burst');
        }
        if (o.type === 'sniper' && !o.fired && o.x < state.w * .84 && o.x > state.px + 18) {
          o.fired = true; o.armedAt = performance.now() + 430;
          o.targetY = clamp(state.y + state.vy * .18, 30, state.h - 30);
          flash(70);
        }
        if (o.type === 'sniper' && o.fired && !o.laser && performance.now() >= o.armedAt) {
          o.laser = { y: o.targetY, life: .24 };
          flash(120);
        }
        if (o.type === 'boss') updateBoss(o, dt);
        if (o.type === 'shuriken' || o.type === 'drop_shuriken') o.dropSpin = (o.dropSpin || 0) + dt * (o.type === 'drop_shuriken' ? 9 : 6);
        if (o.laser && o.laser.life > 0) o.laser.life -= dt;
        if (o.shot && o.shot.life > 0) moveShot(o.shot, dt);
        for (const s of o.shots) if (s.life > 0) moveShot(s, dt);
      }
    }

    function fireAtWave(o, beam) {
      o.fired = true;
      const sx = o.x + o.w * .5;
      const sy = o.gapY + (Math.random() < .5 ? -1 : 1) * o.gapH * .42;
      const dx = state.px - sx;
      const lead = (sx - state.px) / 760;
      const dy = state.y + state.vy * lead * .7 - sy;
      const len = Math.max(1, Math.hypot(dx, dy));
      const speed = beam ? 940 : 760;
      o.shot = { x: sx, y: sy, vx: dx / len * speed, vy: dy / len * speed, life: beam ? .62 : 1.14, beam };
      if (!beam) for (const spread of [-.16, .16]) {
        const ca = Math.cos(spread), sa = Math.sin(spread);
        o.shots.push({ x: sx, y: sy, vx: (dx / len * ca - dy / len * sa) * 690, vy: (dx / len * sa + dy / len * ca) * 690, life: 1.05 });
      }
      flash(85);
    }

    function updateBoss(o, dt) {
      o.armedAt += dt;
      if (o.fired) o.bossTimer += dt;
      if (!o.fired && o.x < state.w * .88) {
        o.fired = true; o.armedAt = 0; o.bossTimer = 0; flash(220);
      }
      const delay = state.extreme ? .72 : .92;
      const limit = state.extreme ? 14 : 10;
      if (o.fired && o.bossTimer < 5.4 && o.armedAt > delay && o.shots.length < limit) {
        o.armedAt = 0;
        const b = bossCenter(o);
        const sx = b.cx - b.size * .42;
        const sy = b.cy + Math.sin(o.bossTimer * 2.4 + o.phase) * o.gapH * .32;
        const base = Math.PI + Math.sin(o.bossTimer * 1.7 + o.phase) * .36;
        const offsets = o.bossPattern === 0 ? [-.38, 0, .38] : o.bossPattern === 1 ? [-.52, -.18, .18, .52] : [-.66, 0, .66];
        for (const off of offsets) {
          if (o.shots.length >= limit) break;
          const a = base + off;
          o.shots.push({ x: sx, y: sy, vx: Math.cos(a) * 470, vy: Math.sin(a) * 470, life: 1.65 });
        }
        if (!o.bossBeam && (o.bossPattern === 1 || Math.floor(o.bossTimer / delay) % 2 === 0)) {
          o.bossBeam = { y: clamp(b.cy + Math.sin(o.bossTimer * 1.15 + o.phase) * o.gapH * .48, 42, state.h - 42), warn: .36, life: 0 };
        }
      }
      if (o.bossBeam) {
        if (o.bossBeam.warn > 0) o.bossBeam.warn -= dt;
        else {
          if (o.bossBeam.life <= 0) { o.bossBeam.life = state.extreme ? .34 : .26; flash(130); }
          o.bossBeam.life -= dt;
          if (o.bossBeam.life <= 0) o.bossBeam = null;
        }
      }
    }

    function moveShot(s, dt) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
    function flash(ms) { state.flashUntil = Math.max(state.flashUntil, performance.now() + ms); }
    function done(o) {
      if (o.type === 'boss' && o.fired) {
        if (o.bossTimer < 6.2) return false;
        if (o.bossBeam && (o.bossBeam.warn > 0 || o.bossBeam.life > 0)) return false;
        if (o.shots.some(s => s.life > 0 && s.x > -40 && s.x < state.w + 80)) return false;
        return true;
      }
      if (o.x + o.w >= -70) return false;
      if (o.shot && o.shot.life > 0 && o.shot.x > -40) return false;
      if (o.shots.some(s => s.life > 0 && s.x > -40 && s.x < state.w + 80)) return false;
      if (o.laser && o.laser.life > 0) return false;
      return true;
    }

    function addTrail(dt) {
      const theme = trailThemes[state.trailTheme] || trailThemes.comet;
      const count = Math.max(2, Math.min(7, Math.ceil(dt * 160)));
      for (let i = 0; i < count; i++) {
        const hue = theme.hues[Math.floor(Math.random() * theme.hues.length)] + (Math.random() - .5) * 18;
        state.trail.push({ x: state.px - i * 4 - Math.random() * 10, y: state.y + (Math.random() - .5) * 12, vx: -170 - Math.random() * 170, vy: -state.vy * .05 + (Math.random() - .5) * 36, age: 0, life: .34 + Math.random() * .34, r: 2.4 + Math.random() * 5.8, hue });
      }
      for (const p of state.trail) { p.x += p.vx * dt; p.y += p.vy * dt; p.age += dt; }
      while (state.trail.length > 210 || (state.trail[0] && state.trail[0].age > state.trail[0].life)) state.trail.shift();
    }

    function hit(o, px, py, r) {
      const top = o.gapY - o.gapH * .5, bot = o.gapY + o.gapH * .5;
      if ((o.type === 'top' || o.type === 'dual') && tri(px, py, r, o.x, 0, o.w, top, true)) return true;
      if ((o.type === 'bottom' || o.type === 'dual') && tri(px, py, r, o.x, state.h, o.w, bot, false)) return true;
      if (o.type === 'diamond' && (diamond(px, py, r, o.x + o.w * .5, Math.max(52, top - o.size * .42), o.size * .36, o.size * .27) || diamond(px, py, r, o.x + o.w * .5, Math.min(state.h - 52, bot + o.size * .42), o.size * .36, o.size * .27))) return true;
      if (o.type === 'spinner' && spinnerHit(o, px, py, r)) return true;
      if (o.type === 'sweep' && segHit(laserSegment(o), px, py, r + 7)) return true;
      if (o.type === 'sword' && swordHit(o, px, py, r)) return true;
      if (o.type === 'zone' && zoneHit(o, px, py, r)) return true;
      if (o.type === 'shuriken' && shurikenHit(o, px, py, r)) return true;
      if (o.type === 'drop_shuriken' && dropShurikenHit(o, px, py, r)) return true;
      if (o.type === 'slash_gate' && slashGateHit(o, px, py, r)) return true;
      if (o.type === 'mines' && mineCenters(o).some(m => Math.hypot(px - m.x, py - m.y) < r + m.r)) return true;
      if (o.type === 'claw' && clawHit(o, px, py, r)) return true;
      if (o.type === 'saw' && sawCenters(o).some(m => Math.hypot(px - m.x, py - m.y) < r + o.size * .2)) return true;
      if (o.type === 'boss') {
        const b = bossCenter(o);
        if (diamond(px, py, r, b.cx, b.cy, b.size * .48, b.size * .38)) return true;
        if (o.bossBeam && o.bossBeam.life > 0 && Math.abs(py - o.bossBeam.y) < r + 12) return true;
        if (o.shots.some(s => s.life > 0 && Math.hypot(px - s.x, py - s.y) < r + 7)) return true;
      }
      if (o.type === 'sniper' && o.laser && o.laser.life > 0 && Math.abs(py - o.laser.y) < r + 7) return true;
      if ((o.type === 'shooter' || o.type === 'burst') && projectileHit(o, px, py, r)) return true;
      return false;
    }

    function draw() {
      const w = state.w, h = state.h;
      const realm = currentRealm();
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, realm.bg[0]); g.addColorStop(.52, realm.bg[1]); g.addColorStop(1, realm.bg[2]);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      drawRealmLights(realm);
      ctx.strokeStyle = `hsla(${realm.hue},100%,70%,.12)`; ctx.lineWidth = 1;
      const grid = 42, off = -(state.dist * .22) % grid;
      for (let x = off; x < w; x += grid) line(x, 0, x, h);
      for (let y = 0; y < h; y += grid) line(0, y, w, y);
      for (const o of state.obstacles) drawObstacle(o);
      drawDarkness();
      drawTrail();
      drawShip(false);
      drawRealmBanner(realm);
      if (performance.now() < state.flashUntil) {
        ctx.globalCompositeOperation = realm.flashOff ? 'source-over' : 'difference';
        ctx.fillStyle = realm.flashOff ? 'rgba(0,0,0,.88)' : 'rgba(255,255,255,.92)';
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'source-over';
      }
      drawShip(true);
    }

    function drawRealmBanner(realm) {
      const score = state.dist / 10;
      const next = realms.find(r => r.at > score);
      const since = score - realm.at;
      ctx.save();
      ctx.textAlign = 'right';
      ctx.fillStyle = realm.accent;
      ctx.shadowColor = realm.accent;
      ctx.shadowBlur = 14;
      ctx.font = '900 14px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillText(realm.tag, state.w - 22, 34);
      ctx.shadowBlur = 0;

    function drawGiantSpike(x, baseY, w, h, dir) {

          ctx.moveTo(fx - 8, baseY);
          ctx.quadraticCurveTo(fx + wobble, fy + (dir === 'down' ? 26 : -26), fx, fy + (dir === 'down' ? 46 : -46));
          ctx.quadraticCurveTo(fx - wobble * .4, fy + (dir === 'down' ? 20 : -20), fx + 8, baseY);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawDiamondSpike(cx, cy, rx, ry, spin) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(spin * .22);
      ctx.beginPath();
      ctx.moveTo(0, -ry);
      ctx.lineTo(rx, 0);
      ctx.lineTo(0, ry);
      ctx.lineTo(-rx, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.20)';
      ctx.beginPath();
      ctx.moveTo(0, -ry);
      ctx.lineTo(rx * .28, 0);
      ctx.lineTo(0, ry * .36);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBlackoutGate(o) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.lineWidth = 12;
      ctx.fillStyle = 'rgba(10,10,16,.70)';
      ctx.beginPath();
      ctx.arc(o.x + o.w * .5, o.gapY, o.size * .42, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = 'rgba(180,180,210,.35)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(o.x + o.w * .5, o.gapY, o.size * (.22 + i * .08), 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBurstBeam(s) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,255,255,.42)';
      ctx.lineWidth = 18;
      line(s.x - s.vx * .14, s.y - s.vy * .14, s.x, s.y);
      ctx.strokeStyle = '#66f7ff';
      ctx.lineWidth = 5;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 18;
      line(s.x - s.vx * .18, s.y - s.vy * .18, s.x, s.y);
      ctx.restore();
    }

    function tri(px,py,r,x,base,w,tip,down) { if(px+r<x || px-r>x+w)return false; const cx=x+w*.5, half=w*.5; const t=Math.max(0,1-Math.abs(px-cx)/half); const edge=base+(tip-base)*t; return down ? py-r<edge : py+r>edge; }
    function diamond(px,py,r,cx,cy,rx,ry) { return Math.abs(px-cx)/Math.max(1,rx+r)+Math.abs(py-cy)/Math.max(1,ry+r)<1; }
    function spinnerHit(o,px,py,r){const cx=o.x+o.w*.5,cy=o.gapY,a=performance.now()*.0045+o.phase;for(let i=0;i<4;i++){const q=a+i*Math.PI/2;if(segDist(px,py,cx,cy,cx+Math.cos(q)*o.size*.5,cy+Math.sin(q)*o.size*.5)<r+5)return true;}return false;}
    function laserSegment(o){const time=performance.now()*.0032,cx=o.x+o.w*.5,cy=o.gapY+Math.sin(time+o.phase)*o.gapH*.34,len=Math.min(210,o.gapH*1.28),angle=Math.sin(time*.85+o.phase)*.92,dx=Math.cos(angle)*len*.5,dy=Math.sin(angle)*len*.5;return{ax:cx-dx,ay:cy-dy,bx:cx+dx,by:cy+dy};}
    function swordState(o){const time=performance.now()*.0045,cx=o.x+o.w*(.42+.14*Math.sin(o.phase)),fromTop=Math.sin(o.phase)>0,windup=(Math.sin(time*1.6+o.phase)+1)*.5,slam=Math.pow(windup,3.2),len=o.gapH*(.35+slam*1.35),baseY=fromTop?o.gapY-o.gapH*.5-34:o.gapY+o.gapH*.5+34,tipY=fromTop?baseY+len:baseY-len;return{cx,baseY,tipY,fromTop,active:slam>.54,charge:windup,x1:cx,y1:baseY,x2:cx,y2:tipY};}
    function swordHit(o,px,py,r){const s=swordState(o);if(!s.active||Math.abs(px-s.cx)>r+13)return false;return s.fromTop?py+r>s.baseY&&py-r<s.tipY:py-r<s.baseY&&py+r>s.tipY;}
    function zoneState(o){const time=performance.now()*.004,phase=(Math.sin(time*1.4+o.phase)+1)*.5,hot=phase>.68,y=o.gapY+Math.sin(o.phase*1.7)*o.gapH*.24,h=24+o.size*.08,x=o.x-12,w=o.w+24;return{x,y,w,h,hot,phase};}
    function zoneHit(o,px,py,r){const z=zoneState(o);return z.hot&&px+r>z.x&&px-r<z.x+z.w&&py+r>z.y-z.h*.5&&py-r<z.y+z.h*.5;}
    function shurikenCenter(o){const time=performance.now()*.0038+o.phase,cx=o.x+o.w*.5+Math.cos(time*1.2)*o.w*.28,cy=o.gapY+Math.sin(time*1.7)*o.gapH*.34;return{x:cx,y:cy,r:o.size*.18};}
    function dropShurikenCenter(o){const travel=Math.max(0,state.w-o.x+o.phase*24),x=o.x+o.w*.5+Math.sin(o.phase*3.1)*28,y=((travel*1.22)%(state.h+180))-90;return{x,y,r:o.size*.16};}
    function slashGateSegments(o){const time=performance.now()*.0036+o.phase,hot=(Math.sin(time*1.4)+1)*.5>.42,len=Math.min(280,o.gapH*1.55),cx=o.x+o.w*.5,cy=o.gapY,spread=o.w*.34;return[-1,0,1].map((n,i)=>{const a=(i-1)*.72+Math.sin(time+n)*.42,dx=Math.cos(a)*len*.5,dy=Math.sin(a)*len*.5,ox=n*spread*.42;return{ax:cx+ox-dx,ay:cy-dy,bx:cx+ox+dx,by:cy+dy,active:hot};});}
    function shurikenHit(o,px,py,r){const c=shurikenCenter(o);return Math.hypot(px-c.x,py-c.y)<r+c.r*.72;}
    function dropShurikenHit(o,px,py,r){const c=dropShurikenCenter(o);return Math.hypot(px-c.x,py-c.y)<r+c.r*.72;}
    function slashGateHit(o,px,py,r){return slashGateSegments(o).some(s=>s.active&&segHit(s,px,py,r+8));}
    function mineCenters(o){const out=[];for(let i=0;i<5;i++){const a=o.phase+i*1.31;out.push({x:o.x+o.w*.15+i*o.w*.22,y:o.gapY+Math.sin(a)*o.gapH*.42,r:o.size*(.075+(i%2)*.02)});}return out;}
    function clawOpen(o){const close=(Math.sin(performance.now()*.0048*1.55+o.phase)+1)*.5;return o.gapH*(.48-close*.28);}
    function clawHit(o,px,py,r){if(px+r<o.x||px-r>o.x+o.w)return false;return Math.abs(py-o.gapY)>clawOpen(o)-r;}
    function sawCenters(o){const out=[];for(let i=0;i<3;i++){out.push({x:o.x+i*o.w*.36,y:o.gapY+Math.sin(performance.now()*.006+o.phase+i)*o.gapH*.36});}return out;}
    function projectileHit(o,px,py,r){const s=o.shot;if(s&&s.life>0){if(s.beam ? segDist(px,py,s.x-s.vx*.12,s.y-s.vy*.12,s.x,s.y)<r+8 : Math.hypot(px-s.x,py-s.y)<r+8)return true;}return o.shots.some(q=>q.life>0&&Math.hypot(px-q.x,py-q.y)<r+7);}
    function bossCenter(o){const size=o.size*(state.extreme?1.58:1.36);return{size,cx:Math.min(o.x+o.w*.5,state.w-Math.max(104,size*.58)),cy:clamp(o.gapY,72,state.h-72)};}
    function segHit(s,px,py,r){return segDist(px,py,s.ax,s.ay,s.bx,s.by)<r;}
    function segDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,c=clamp((wx*vx+wy*vy)/Math.max(1,vx*vx+vy*vy),0,1);return Math.hypot(px-(ax+vx*c),py-(ay+vy*c));}
    function angleDiff(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b));}
    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
    function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
    function poly(points, fill){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();if(fill)ctx.fill();ctx.stroke();}
    function drawDiamond(cx,cy,rx,ry,hue){ctx.fillStyle=`hsl(${hue},95%,50%)`;ctx.strokeStyle='rgba(255,255,255,.64)';ctx.beginPath();ctx.moveTo(cx,cy-ry);ctx.lineTo(cx+rx,cy);ctx.lineTo(cx,cy+ry);ctx.lineTo(cx-rx,cy);ctx.closePath();ctx.fill();ctx.stroke();}

    function crash() {
      if (state.crashed) return;
      state.crashed = true; state.active = false; flash(260);
      const score = Math.floor(state.dist / 10);
      if (score > state.best) { state.best = score; localStorage.wave_dash_extreme_best = String(score); }
      bestEl.textContent = `BEST ${state.best}`;
      setTimeout(() => { menu.style.display = 'grid'; }, 520);
    }

    function setHolding(v) { state.holding = v; }
    addEventListener('resize', resize);
    addEventListener('pointerdown', () => setHolding(true));
    addEventListener('pointerup', () => setHolding(false));
    addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === 'ArrowUp') { e.preventDefault(); setHolding(true); }
      if (e.key === '/') {
        const now = performance.now();
        state.slashTimes = state.slashTimes.filter(t => now - t < 1000);
        state.slashTimes.push(now);
        if (state.slashTimes.length >= 3) { state.extreme = true; flash(500); }
      }
    });
    addEventListener('keyup', e => { if (e.code === 'Space' || e.key === 'ArrowUp') setHolding(false); });
    startBtn.addEventListener('click', reset);
    for (const [key, theme] of Object.entries(trailThemes)) {
      const btn = document.createElement('button');
      btn.textContent = theme.name;
      btn.className = key === state.trailTheme ? 'active' : '';
      btn.addEventListener('click', () => {
        state.trailTheme = key;
        localStorage.wave_dash_trail = key;
        [...trailsEl.children].forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
      trailsEl.appendChild(btn);
    }
    resize();
    bestEl.textContent = `BEST ${state.best}`;
    draw();
  })();
  </script>
</body>
</html>
